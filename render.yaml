services:
  - type: web
    name: prodip-volunteer-tracker
    env: python
    buildCommand: pip install -r requirements.txt && python -m app.seed_data
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
